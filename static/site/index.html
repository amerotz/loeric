<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>LOERIC</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg-dark: #0f0f0f;
        --bg-panel: #1a1a1a;
        --bg-input: #232323;
        --text-primary: #e8e8e8;
        --text-secondary: #a0a0a0;
        --accent: #00d4aa;
        --accent-dark: #00a88a;
        --danger: #ff4444;
        --success: #44ff44;
        --border: #2a2a2a;
    }

    html, body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg-dark);
        color: var(--text-primary);
    }

    body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .header {
        padding: 1rem;
        background: linear-gradient(135deg, var(--bg-panel), var(--bg-dark));
        border-bottom: 1px solid var(--border);
        text-align: center;
    }

    .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
    }

    .status-display {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 0.25rem;
        font-family: monospace;
        font-size: 0.75rem;
    }

    .status-display .label {
        color: var(--text-secondary);
    }

    .status-display .value {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--accent);
        font-weight: 600;
    }

    .status-display.running .value {
        animation: pulse-text 1s infinite;
    }

    @keyframes pulse-text {
        50% { opacity: 0.6; }
    }

    .content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .panel {
        padding: 1rem;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 0.375rem;
    }

    .panel-title {
        display: block;
        margin-bottom: 0.75rem;
        color: var(--text-secondary);
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .form-group {
        margin-bottom: 1rem;
    }

    .form-group:last-child {
        margin-bottom: 0;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
    }

    select, input[type="range"] {
        width: 100%;
        padding: 0.625rem;
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: 0.25rem;
        font-size: 0.875rem;
        font-family: inherit;
    }

    select {
        cursor: pointer;
    }

    select:focus {
        outline: none;
        border-color: var(--accent);
    }

    input[type="range"] {
        padding: 0;
        height: 0.5rem;
        accent-color: var(--accent);
        cursor: pointer;
    }

    .slider-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        margin-bottom: 0.375rem;
    }

    .slider-label-value {
        color: var(--accent);
        font-weight: 600;
        font-family: monospace;
    }

    .info-text {
        margin-top: 0.5rem;
        color: var(--text-secondary);
        font-size: 0.75rem;
        line-height: 1.4;
    }

    .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
    }

    button {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        background: var(--bg-input);
        color: var(--text-primary);
        border-radius: 0.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        font-family: inherit;
    }

    button:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    button:active {
        transform: scale(0.98);
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-primary {
        background: var(--accent);
        color: var(--bg-dark);
        border-color: var(--accent);
    }

    .btn-primary:hover {
        background: var(--accent-dark);
        color: var(--bg-dark);
    }

    .btn-danger {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
    }

    .btn-danger:hover {
        background: #ff2222;
        color: white;
    }

    .status-indicator {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: var(--text-secondary);
    }

    .status-indicator.active {
        background: var(--success);
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% { opacity: 0.4; }
    }

    .section-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
    }

    .error-message,
    .success-message {
        display: none;
        padding: 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.8rem;
    }

    .error-message {
        background: rgba(255, 68, 68, 0.1);
        border: 1px solid var(--danger);
        color: #ff8888;
    }

    .success-message {
        background: rgba(68, 255, 68, 0.1);
        border: 1px solid var(--success);
        color: #88ff88;
    }

    .error-message.show,
    .success-message.show {
        display: block;
    }

    .loading {
        opacity: 0.6;
        pointer-events: none;
    }

    .number-control {
        display: grid;
        grid-template-columns: 3rem 1fr 3rem;
        gap: 0.5rem;
        align-items: center;
    }

    .number-control-btn,
    .number-control-input {
        height: 2.75rem;
        border: 1px solid var(--border);
        background: var(--bg-input);
        color: var(--text-primary);
        border-radius: 0.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        font-family: inherit;
        text-align: center;
    }

    .number-control-input {
        width: 100%;
        appearance: textfield;
    }

    .number-control-input::-webkit-inner-spin-button,
    .number-control-input::-webkit-outer-spin-button {
        appearance: none;
    }

    @media (min-width: 640px) {
        .content {
            padding: 1.5rem;
            gap: 1.5rem;
        }

        .panel {
            padding: 1.5rem;
        }

        .section-grid {
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>


</head>

<body>

<header class="header">
    <div class="status-display">
        <h1>LOERIC</h1>
        <span class="label">Status</span>
        <div class="value">
            <span class="status-indicator"></span>
            <span id="statusText">Idle</span>
        </div>
    </div>
</header>

<main class="content">

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <!-- Tune and configuration -->

    <div class="section-grid">

        <div class="panel">
            <label class="panel-title" for="tuneSelect">Tune</label>
            <select id="tuneSelect">
                <option value="">Loading tunes...</option>
            </select>
            <div class="info-text">Select a tune</div>
        </div>

        <div class="panel">
            <label class="panel-title" for="configSelect">Configuration</label>
            <select id="configSelect">
                <option value="">Select a tune first</option>
            </select>
            <div class="info-text">Select configuration preset</div>
        </div>

    </div>

    <!-- Instrument and numeric controls -->

    <div class="section-grid">

        <div class="panel">
            <label class="panel-title" for="instrumentSelect">Instrument Model</label>
            <select id="instrumentSelect">
                <option value="">Loading instruments...</option>
            </select>
            <div class="info-text">Choose the instrument model</div>
        </div>

        <div class="panel">
            <label class="panel-title">Repeats</label>

            <div class="number-control">
                <button id="decRepeatBtn" type="button">−</button>
                <input id="repetitionInput" class="number-control-input"
                       type="number" min="1" value="1">
                <button id="incRepeatBtn" type="button">+</button>
            </div>

            <div class="info-text">Choose number of repetitions</div>
        </div>

        <div class="panel">
            <label class="panel-title">Transpose</label>

            <div class="number-control">
                <button id="decTransposeBtn" type="button">−</button>
                <input id="transposeInput" class="number-control-input"
                       type="number" min="-24" max="24" value="0">
                <button id="incTransposeBtn" type="button">+</button>
            </div>

            <div class="info-text">Semitone offset</div>
        </div>

    </div>

    <!-- Tempo -->

    <div class="panel">
        <label class="panel-title">Tempo</label>

        <div class="slider-label">
            <span>Quarters Per Minute</span>
            <span id="tempoValue" class="slider-label-value">160</span>
        </div>

        <input type="range" id="tempoSlider"
               min="40" max="250" value="160">
    </div>

    <!-- Dynamic server controls -->

    <div id="dynamicControls" class="section-grid"></div>

    <!-- Start and stop -->

    <div class="panel">
        <div class="button-group">
            <button id="startBtn" class="btn-primary">Start</button>
            <button id="stopBtn" class="btn-danger">Stop/Pause</button>
        </div>
    </div>

</main>

<script>
    const API_BASE = '';

    const state = {
        running: false,
        currentTune: null,
        currentConfig: null,
        currentInstrument: null,
        repetitions: 1,
        transpose: 0,
        tempo: 160,
    };

    const elements = {
        tuneSelect: document.getElementById('tuneSelect'),
        configSelect: document.getElementById('configSelect'),
        instrumentSelect: document.getElementById('instrumentSelect'),

        repetitionInput: document.getElementById('repetitionInput'),
        transposeInput: document.getElementById('transposeInput'),

        tempoSlider: document.getElementById('tempoSlider'),
        tempoValue: document.getElementById('tempoValue'),

        startBtn: document.getElementById('startBtn'),
        stopBtn: document.getElementById('stopBtn'),

        statusText: document.getElementById('statusText'),
        statusIndicator: document.querySelector('.status-indicator'),
        statusDisplay: document.querySelector('.status-display'),

        errorMessage: document.getElementById('errorMessage'),
        successMessage: document.getElementById('successMessage'),

        dynamicControls: document.getElementById('dynamicControls')
    };

    // ============================================================
    // Notifications
    // ============================================================

    let errorTimeout;
    let successTimeout;

    function showError(message) {
        elements.errorMessage.textContent = message;
        elements.errorMessage.classList.add('show');

        clearTimeout(errorTimeout);

        errorTimeout = setTimeout(() => {
            elements.errorMessage.classList.remove('show');
        }, 5000);
    }

    function showSuccess(message) {
        elements.successMessage.textContent = message;
        elements.successMessage.classList.add('show');

        clearTimeout(successTimeout);

        successTimeout = setTimeout(() => {
            elements.successMessage.classList.remove('show');
        }, 3000);
    }

    // ============================================================
    // API
    // ============================================================

    async function apiCall(endpoint, method = 'GET', data = null) {

        const options = {
            method,
            headers: {
                'Content-Type': 'application/json'
            }
        };

        if (data !== null) {
            options.body = JSON.stringify(data);
        }

        const response = await fetch(`${API_BASE}${endpoint}`, options);

        if (!response.ok) {
            let message = 'Request failed';

            try {
                const error = await response.json();
                message = error.detail || message;
            } catch {}

            throw new Error(message);
        }

        return response.json();
    }

    // ============================================================
    // UI State
    // ============================================================

    function updateUI() {

        elements.startBtn.disabled =
            state.running || !state.currentTune;

        elements.stopBtn.disabled =
            !state.running;

        elements.statusIndicator.classList.toggle(
            'active',
            state.running
        );

        elements.statusText.textContent =
            state.running ? 'Running' : 'Idle';

        elements.statusDisplay.classList.toggle(
            'running',
            state.running
        );

        elements.tuneSelect.disabled = state.running;
        elements.configSelect.disabled = state.running;
        elements.instrumentSelect.disabled = state.running;
    }

    // ============================================================
    // Load tunes
    // ============================================================

    async function loadTunes() {

        try {

            const response = await apiCall('/api/tunes');

            elements.tuneSelect.innerHTML = '';

            if (!response.tunes.length) {
                elements.tuneSelect.add(new Option('No tunes found', ''));
                return;
            }

            elements.tuneSelect.add(
                new Option('Select a tune...', '')
            );

            response.tunes.forEach(tune => {
                elements.tuneSelect.add(
                    new Option(tune.name, tune.id)
                );
            });

        } catch (error) {
            elements.tuneSelect.innerHTML =
                '<option value="">Error loading tunes</option>';

            showError(error.message);
        }
    }

    // ============================================================
    // Load configurations
    // ============================================================

    async function loadConfigs(tuneId) {

        elements.configSelect.innerHTML = '';

        state.currentConfig = null;

        if (!tuneId) {
            elements.configSelect.add(
                new Option('Select a tune first', '')
            );
            return;
        }

        try {

            const response = await apiCall(
                `/api/configs/${encodeURIComponent(tuneId)}`
            );

            // Add default config first
            const option = document.createElement('option');

            if (response.default_config) {
                option.value = response.default_config.id;
                state.currentConfig = response.default_config.id;
            } else {
                // No default config file: use null
                option.value = "";
                state.currentConfig = null;
            }

            option.textContent = "Default";
            option.selected = true;
            elements.configSelect.appendChild(option);

            (response.configs || []).forEach(config => {

                elements.configSelect.add(
                    new Option(config.name, config.id)
                );

            });

        } catch (error) {

            elements.configSelect.add(
                new Option('Error loading configs', '')
            );

            showError(error.message);
        }
    }

    // ============================================================
    // Load instruments
    // ============================================================

    async function loadInstruments() {

        try {

            const response = await apiCall('/api/instruments');

            elements.instrumentSelect.innerHTML = '';

            if (!response.models.length) {
                elements.instrumentSelect.add(
                    new Option('No instruments found', '')
                );
                return;
            }

            elements.instrumentSelect.add(
                new Option('Select an instrument...', '')
            );

            response.models.forEach(instrument => {
                elements.instrumentSelect.add(
                    new Option(instrument.name, instrument.id)
                );
            });

        } catch (error) {

            elements.instrumentSelect.innerHTML =
                '<option value="">Error loading instruments</option>';

            showError(error.message);
        }
    }

    // ============================================================
    // Dynamic slider registration
    // ============================================================

    const registeredSliders = new Map();

    function registerSlider(config) {

        const {
            id,
            label,
            path,
            min = 0,
            max = 1,
            step = 0.01,
            value = 0.5,
            decimals,
            suffix = ''
        } = config;

        const panel = document.createElement('div');
        panel.className = 'panel';

        const title = document.createElement('label');
        title.className = 'panel-title';
        title.textContent = label;

        const sliderLabel = document.createElement('div');
        sliderLabel.className = 'slider-label';

        const description = document.createElement('span');
        description.textContent = label;

        const valueDisplay = document.createElement('span');
        valueDisplay.className = 'slider-label-value';

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = min;
        slider.max = max;
        slider.step = step;
        slider.value = value;

        const formatValue = val => {
            const formatted = decimals !== undefined
                ? Number(val).toFixed(decimals)
                : val;

            return `${formatted}${suffix}`;
        };

        valueDisplay.textContent = formatValue(value);

        sliderLabel.append(description, valueDisplay);

        panel.append(title, sliderLabel, slider);

        elements.dynamicControls.appendChild(panel);

        const control = {
            id,
            path,
            slider,
            valueDisplay,
            formatValue,
            lastValue: String(value),
            timer: null
        };

        registeredSliders.set(id, control);

        slider.addEventListener('input', () => {

            valueDisplay.textContent = formatValue(slider.value);

            // Debounce requests to avoid flooding the API.
            clearTimeout(control.timer);

            control.timer = setTimeout(async () => {

                try {

                    const encodedPath = control.path
                        .split('/')
                        .map(encodeURIComponent)
                        .join('/');

                    await apiCall(
                        `/api/change/${encodedPath}?value=${encodeURIComponent(slider.value)}`,
                        'POST'
                    );

                    control.lastValue = String(slider.value);

                } catch (error) {

                    showError(`Failed to update ${label}: ${error.message}`);

                    // Restore the last successfully sent value.
                    slider.value = control.lastValue;
                    valueDisplay.textContent =
                        formatValue(control.lastValue);
                }

            }, 100);

        });

        return control;
    }

    // ============================================================
    // Server-driven controls
    // ============================================================

    let controlRequestId = 0;

    async function loadServerControls() {

        const requestId = ++controlRequestId;

        elements.dynamicControls.innerHTML = '';
        registeredSliders.clear();


        const params = new URLSearchParams();

        if (state.currentTune) {
            params.set('tune_id', state.currentTune);
        }

        if (state.currentInstrument) {
            params.set('instrument_model', state.currentInstrument);
        }

        if (state.currentConfig) {
            params.set('config', state.currentConfig);
        } else {
            params.set('config', 'default');
        }


        try {

            const response = await apiCall(
                `/api/ui/controls?${params}`
            );

            if (requestId !== controlRequestId) return;

            if (!response.controls || !response.controls.length) {

                const message = document.createElement('div');
                message.className = 'panel info-text';
                message.textContent =
                    'No additional controls available for this selection.';

                elements.dynamicControls.appendChild(message);

                return;
            }

            response.controls.forEach(control => {
                registerSlider(control);
            });

        } catch (error) {

            if (requestId !== controlRequestId) return;

            showError(`Failed to load controls: ${error.message}`);
        }
    }

    // ============================================================
    // Tune selection
    // ============================================================

    elements.tuneSelect.addEventListener('change', async event => {

        state.currentTune = event.target.value;

        await loadConfigs(state.currentTune);

        await loadServerControls();

        updateUI();
    });

    // ============================================================
    // Configuration selection
    // ============================================================

    elements.configSelect.addEventListener('change', async event => {

        state.currentConfig = event.target.value;

        await loadServerControls();
    });

    // ============================================================
    // Instrument selection
    // ============================================================

    elements.instrumentSelect.addEventListener('change', async event => {

        state.currentInstrument = event.target.value;

        await loadServerControls();
    });

    // ============================================================
    // Repetitions
    // ============================================================

    document.getElementById('decRepeatBtn').addEventListener('click', () => {

        state.repetitions = Math.max(1, state.repetitions - 1);

        elements.repetitionInput.value = state.repetitions;
    });

    document.getElementById('incRepeatBtn').addEventListener('click', () => {

        state.repetitions++;

        elements.repetitionInput.value = state.repetitions;
    });

    elements.repetitionInput.addEventListener('change', event => {

        state.repetitions = Math.max(
            1,
            parseInt(event.target.value, 10) || 1
        );

        event.target.value = state.repetitions;
    });

    // ============================================================
    // Transpose
    // ============================================================

    async function changeTranspose(value) {

        state.transpose = Math.max(-24, Math.min(24, value));

        elements.transposeInput.value = state.transpose;

        try {

            await apiCall(
                `/api/change/groover/modules/transpose/steps?value=${state.transpose}`,
                'POST'
            );

            showSuccess(`Transpose: ${state.transpose}`);

        } catch (error) {
            showError(error.message);
        }
    }

    document.getElementById('decTransposeBtn').addEventListener(
        'click',
        () => changeTranspose(state.transpose - 1)
    );

    document.getElementById('incTransposeBtn').addEventListener(
        'click',
        () => changeTranspose(state.transpose + 1)
    );

    elements.transposeInput.addEventListener('change', event => {

        const value = parseInt(event.target.value, 10) || 0;

        changeTranspose(value);
    });

    // ============================================================
    // Tempo
    // ============================================================

    elements.tempoSlider.addEventListener('input', async event => {

        state.tempo = parseInt(event.target.value, 10);

        elements.tempoValue.textContent = state.tempo;

        try {

            await apiCall(`/api/tempo/${state.tempo}`, 'POST');

        } catch (error) {
            showError(error.message);
        }
    });

    // ============================================================
    // Start
    // ============================================================

    elements.startBtn.addEventListener('click', async () => {

        if (!state.currentTune) {
            showError('Please select a tune first');
            return;
        }

        if (!state.currentInstrument) {
            showError('Please select an instrument');
            return;
        }

        try {

            elements.startBtn.classList.add('loading');

            await apiCall('/api/start', 'POST', {

                tune: state.currentTune,
                config: state.currentConfig,
                instrument_model: state.currentInstrument,

                tempo: state.tempo,
                repetitions: state.repetitions,
                transpose: state.transpose,

            });

            state.running = true;

            updateUI();

            showSuccess(`Started: ${state.currentTune}`);

        } catch (error) {

            showError(`Failed to start LOERIC: ${error.message}`);

        } finally {

            elements.startBtn.classList.remove('loading');

        }
    });

    // ============================================================
    // Stop
    // ============================================================

    elements.stopBtn.addEventListener('click', async () => {

        try {

            elements.stopBtn.classList.add('loading');

            await apiCall('/api/stop', 'POST');

            state.running = false;

            updateUI();

            showSuccess('Stopped');

        } catch (error) {

            showError(`Failed to stop LOERIC: ${error.message}`);

        } finally {

            elements.stopBtn.classList.remove('loading');

        }
    });

    // ============================================================
    // Status polling
    // ============================================================

    async function pollStatus() {

        try {

            const response = await apiCall('/api/status');

            if (response.running !== state.running) {

                state.running = response.running;

                updateUI();
            }

            if (response.current_tune) {
                state.currentTune = response.current_tune;
            }

        } catch {
            // Silent failure to avoid repeated notifications.
        }
    }

    // ============================================================
    // Initialization
    // ============================================================

    async function init() {

        updateUI();

        await Promise.all([
            loadTunes(),
            loadInstruments()
        ]);

        await loadServerControls();
        await pollStatus();

        setInterval(pollStatus, 2000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }


</script>


</body> </html>
